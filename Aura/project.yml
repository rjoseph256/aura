name: Aura
options:
  bundleIdPrefix: app.aura
  deploymentTarget:
    iOS: "17.0"
packages:
  AuraCore:
    path: ../AuraCore
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    majorVersion: 11.0.0
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    majorVersion: 3.0.0
  MapboxSearch:
    url: https://github.com/mapbox/search-ios.git
    majorVersion: 2.0.0
targets:
  Aura:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Info.plist
          - MapboxAccessToken
          - sample-ride-pittsburgh.gpx
          - Fonts
      # Bundled Saira Condensed faces (OFL) — classified as resources and
      # registered via UIAppFonts in Resources/Info.plist.
      - path: Resources/Fonts
      # Extension-less token file: force it into the resources copy phase
      # so the bundled pk.… token ships in the .app (XcodeGen won't classify
      # an extension-less file as a resource on its own).
      - path: Resources/MapboxAccessToken
        buildPhase: resources
      # Sample GPX that drives the simulated free ride — force it into the
      # resources copy phase so Bundle.main can load it at runtime.
      - path: Resources/sample-ride-pittsburgh.gpx
        buildPhase: resources
    dependencies:
      # Embeds the Live Activity / widget extension into the app bundle.
      - target: AuraWidgets
      - package: AuraCore
        product: AuraCore
      - package: AuraCore
        product: AuraKit
      - package: MapboxMaps
        product: MapboxMaps
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxNavigationUIKit
      - package: MapboxNavigation
        product: MapboxDirections
      - package: MapboxSearch
        product: MapboxSearch
      - package: MapboxSearch
        product: MapboxSearchUI
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.aura.ios
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # Live Activity / Dynamic Island host. WidgetKit extension that renders the
  # in-progress-ride Live Activity. Depends only on the pure AuraKit/AuraCore layers
  # (no Mapbox); shares the ActivityAttributes contract and AuraTheme with the app so
  # the activity reads like a slice of the HUD.
  AuraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      # Shared with the app so both sides compile the same Live Activity contract / theme.
      - path: Sources/LiveActivity/RideActivityAttributes.swift
      - path: Sources/Theme/AuraTheme.swift
      # Bundled Saira Condensed faces (OFL), registered via Widgets/Info.plist
      # UIAppFonts so the Live Activity can render cockpit numerals.
      - path: Resources/Fonts
    dependencies:
      - package: AuraCore
        product: AuraCore
      - package: AuraCore
        product: AuraKit
    settings:
      base:
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.aura.ios.AuraWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
