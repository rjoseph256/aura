<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1400" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', sans-serif">
  <rect width="780" height="1400" fill="#07080C"/>

  <!-- header -->
  <text x="40" y="52" fill="#EBEBEB" font-size="24" font-weight="700">Crew identity board — gate 1 mockup</text>
  <text x="40" y="78" fill="#9EA0A6" font-size="13">decisions locked: roster poll · explicit Join + caption · roster keeps status colors</text>

  <!-- ===== palette strip ===== -->
  <text x="40" y="122" fill="#7CF0A8" font-size="14" font-weight="700">Rider hues — 5 shipped + 3 widening (ROH-114; values at plan stage)</text>
  <g transform="translate(56,160)">
    <circle r="17" fill="#53CFD8"/><text y="38" fill="#5B5D63" font-size="10" text-anchor="middle">cyan</text>
    <g transform="translate(58,0)"><circle r="17" fill="#4A68C9"/><text y="38" fill="#5B5D63" font-size="10" text-anchor="middle">navy</text></g>
    <g transform="translate(116,0)"><circle r="17" fill="#B07AD0"/><text y="38" fill="#5B5D63" font-size="10" text-anchor="middle">violet</text></g>
    <g transform="translate(174,0)"><circle r="17" fill="#B85138"/><text y="38" fill="#5B5D63" font-size="10" text-anchor="middle">rust</text></g>
    <g transform="translate(232,0)"><circle r="17" fill="#D8B85E"/><text y="38" fill="#5B5D63" font-size="10" text-anchor="middle">gold</text></g>
    <g transform="translate(300,0)"><circle r="17" fill="none" stroke="#3A3D45" stroke-width="2" stroke-dasharray="4 4"/><text y="4.5" fill="#3A3D45" font-size="13" text-anchor="middle">+</text></g>
    <g transform="translate(358,0)"><circle r="17" fill="none" stroke="#3A3D45" stroke-width="2" stroke-dasharray="4 4"/><text y="4.5" fill="#3A3D45" font-size="13" text-anchor="middle">+</text></g>
    <g transform="translate(416,0)"><circle r="17" fill="none" stroke="#3A3D45" stroke-width="2" stroke-dasharray="4 4"/><text y="4.5" fill="#3A3D45" font-size="13" text-anchor="middle">+</text></g>
    <g transform="translate(510,0)"><circle r="17" fill="#FFFFFF"/><circle r="13" fill="#FFFFFF" stroke="#07080C" stroke-width="2"/><text y="38" fill="#5B5D63" font-size="10" text-anchor="middle">you = white</text></g>
  </g>

  <!-- ===== one crew, three surfaces ===== -->
  <text x="40" y="268" fill="#7CF0A8" font-size="14" font-weight="700">One crew, three surfaces — hue latched per rider, never reshuffles</text>
  <text x="40" y="288" fill="#9EA0A6" font-size="12">Jamie (you, host) · Priya · Marcus · Sam (dropped)</text>

  <!-- map panel -->
  <g transform="translate(40,310)">
    <rect width="220" height="270" rx="16" fill="#0B0D12" stroke="#1C1E24"/>
    <text x="110" y="28" fill="#5B5D63" font-size="11.5" font-weight="600" text-anchor="middle">MAP — identity hues</text>
    <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2.5">
      <line x1="15" y1="90" x2="205" y2="70"/><line x1="60" y1="45" x2="90" y2="255"/>
      <line x1="15" y1="190" x2="205" y2="175"/><line x1="150" y1="45" x2="175" y2="255"/>
    </g>
    <path d="M 40 240 L 105 160 L 170 90" stroke="#07080C" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 40 240 L 105 160 L 170 90" stroke="#7CF0A8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- peers: hued discs + monograms + pointer -->
    <g transform="translate(150,120)"><circle r="14" fill="#53CFD8"/><text y="4.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">P</text></g>
    <g transform="translate(70,205)"><circle r="14" fill="#B07AD0"/><text y="4.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">M</text></g>
    <g transform="translate(185,220)" opacity="0.45"><circle r="14" fill="#D8B85E"/><text y="4.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">S</text></g>
    <!-- self: white riding puck -->
    <g transform="translate(105,160) rotate(39) scale(0.6)">
      <path d="M 0 -24 L 18 24 L -18 24 Z" fill="#7CF0A8" stroke="#7CF0A8" stroke-width="10" stroke-linejoin="round"/>
      <path d="M 0 -22 L 16.5 22 L -16.5 22 Z" fill="#07080C" stroke="#07080C" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 0 -19 L 14.4 19 L -14.4 19 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <text x="110" y="258" fill="#5B5D63" font-size="10" text-anchor="middle">dropped rider dims · white puck = you</text>
  </g>

  <!-- lobby panel -->
  <g transform="translate(280,310)">
    <rect width="220" height="270" rx="16" fill="#0B0D12" stroke="#1C1E24"/>
    <text x="110" y="28" fill="#5B5D63" font-size="11.5" font-weight="600" text-anchor="middle">LOBBY — identity hues</text>
    <!-- join code card, sentence case + Saira-ish -->
    <rect x="16" y="42" width="188" height="58" rx="12" fill="#12141A" stroke="#22242B"/>
    <text x="110" y="62" fill="#9EA0A6" font-size="10.5" text-anchor="middle">Join code</text>
    <text x="110" y="88" fill="#EBEBEB" font-size="21" font-weight="700" letter-spacing="4" text-anchor="middle" font-family="'Saira Condensed','Arial Narrow',sans-serif">MX4T7QRK</text>
    <!-- rows -->
    <g transform="translate(16,118)">
      <circle cx="16" cy="16" r="14" fill="#FFFFFF"/><circle cx="16" cy="16" r="10.5" fill="#FFFFFF" stroke="#07080C" stroke-width="2"/>
      <text x="40" y="14" fill="#EBEBEB" font-size="12.5" font-weight="600">Jamie Rivera</text>
      <text x="40" y="27" fill="#7CF0A8" font-size="9.5" font-weight="700">You · Host</text>
    </g>
    <line x1="16" y1="156" x2="204" y2="156" stroke="#1C1E24"/>
    <g transform="translate(16,166)">
      <circle cx="16" cy="16" r="14" fill="#53CFD8"/><text x="16" y="20.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">P</text>
      <text x="40" y="21" fill="#EBEBEB" font-size="12.5" font-weight="600">Priya</text>
    </g>
    <line x1="16" y1="204" x2="204" y2="204" stroke="#1C1E24"/>
    <g transform="translate(16,214)">
      <circle cx="16" cy="16" r="14" fill="#B07AD0"/><text x="16" y="20.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">M</text>
      <text x="40" y="21" fill="#EBEBEB" font-size="12.5" font-weight="600">Marcus</text>
    </g>
    <text x="110" y="262" fill="#5B5D63" font-size="10" text-anchor="middle">rows fill live via the roster poll</text>
  </g>

  <!-- roster panel -->
  <g transform="translate(520,310)">
    <rect width="220" height="270" rx="16" fill="#0B0D12" stroke="#1C1E24"/>
    <text x="110" y="28" fill="#5B5D63" font-size="11.5" font-weight="600" text-anchor="middle">ROSTER — status colors kept</text>
    <g transform="translate(16,50)">
      <circle cx="16" cy="16" r="14" fill="#FFFFFF"/><text x="16" y="20.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">J</text>
      <text x="40" y="14" fill="#EBEBEB" font-size="12.5" font-weight="600">Jamie Rivera</text>
      <text x="40" y="27" fill="#9EA0A6" font-size="9.5" font-weight="700">YOU</text>
    </g>
    <line x1="16" y1="88" x2="204" y2="88" stroke="#1C1E24"/>
    <g transform="translate(16,98)">
      <circle cx="16" cy="16" r="14" fill="#7CF0A8"/><text x="16" y="20.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">P</text>
      <text x="40" y="21" fill="#EBEBEB" font-size="12.5" font-weight="600">Priya</text>
      <text x="204" y="21" fill="#9EA0A6" font-size="10.5" text-anchor="end" font-family="'Saira Condensed','Arial Narrow',sans-serif">0.4 mi ahead</text>
    </g>
    <line x1="16" y1="136" x2="204" y2="136" stroke="#1C1E24"/>
    <g transform="translate(16,146)">
      <circle cx="16" cy="16" r="14" fill="#F5C24B"/><text x="16" y="20.5" fill="#07080C" font-size="12" font-weight="800" text-anchor="middle">M</text>
      <text x="40" y="21" fill="#EBEBEB" font-size="12.5" font-weight="600">Marcus</text>
      <rect x="138" y="6" width="58" height="19" rx="9.5" fill="#F5C24B"/>
      <text x="167" y="19" fill="#07080C" font-size="9.5" font-weight="800" text-anchor="middle">Stopped</text>
    </g>
    <line x1="16" y1="184" x2="204" y2="184" stroke="#1C1E24"/>
    <g transform="translate(16,194)">
      <circle cx="16" cy="16" r="14" fill="#3A3D45"/><text x="16" y="20.5" fill="#9EA0A6" font-size="12" font-weight="800" text-anchor="middle">S</text>
      <text x="40" y="21" fill="#EBEBEB" font-size="12.5" font-weight="600">Sam</text>
      <rect x="132" y="6" width="64" height="19" rx="9.5" fill="#2A2D34"/>
      <text x="164" y="19" fill="#9EA0A6" font-size="9.5" font-weight="800" text-anchor="middle">No signal</text>
    </g>
    <text x="110" y="258" fill="#5B5D63" font-size="10" text-anchor="middle">“You YOU” fixed · mint/amber scan intact</text>
  </g>

  <!-- ===== join screen keyboard-up ===== -->
  <text x="40" y="640" fill="#7CF0A8" font-size="14" font-weight="700">Join screen — keyboard UP on an SE (the state v1's layout failed)</text>
  <g transform="translate(220,668)">
    <!-- SE frame 320x568 pt -->
    <rect width="340" height="600" rx="28" fill="#0B0D12" stroke="#2A2D34" stroke-width="2"/>
    <text x="30" y="46" fill="#9EA0A6" font-size="12">Cancel</text>
    <text x="170" y="72" fill="#EBEBEB" font-size="17" font-weight="700" text-anchor="middle">Crew</text>
    <text x="170" y="92" fill="#9EA0A6" font-size="10.5" text-anchor="middle">Start a ride together, or enter a code to join one</text>
    <!-- start CTA -->
    <rect x="24" y="106" width="292" height="42" rx="12" fill="#7CF0A8"/>
    <text x="170" y="132" fill="#07080C" font-size="14" font-weight="700" text-anchor="middle">Start a ride</text>
    <!-- divider -->
    <line x1="24" y1="172" x2="120" y2="172" stroke="#22242B"/>
    <text x="170" y="176" fill="#5B5D63" font-size="10" text-anchor="middle">or join with a code</text>
    <line x1="220" y1="172" x2="316" y2="172" stroke="#22242B"/>
    <!-- code boxes: 5 filled, 6th focused -->
    <g transform="translate(24,192)">
      <g font-family="'Saira Condensed','Arial Narrow',sans-serif" font-size="16" font-weight="700">
        <rect width="32" height="40" rx="8" fill="#12141A" stroke="#3A3D45"/><text x="16" y="26" fill="#EBEBEB" text-anchor="middle">M</text>
        <g transform="translate(37,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#3A3D45"/><text x="16" y="26" fill="#EBEBEB" text-anchor="middle">X</text></g>
        <g transform="translate(74,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#3A3D45"/><text x="16" y="26" fill="#EBEBEB" text-anchor="middle">4</text></g>
        <g transform="translate(111,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#3A3D45"/><text x="16" y="26" fill="#EBEBEB" text-anchor="middle">T</text></g>
        <g transform="translate(148,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#3A3D45"/><text x="16" y="26" fill="#EBEBEB" text-anchor="middle">7</text></g>
        <g transform="translate(185,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#7CF0A8" stroke-width="2"/></g>
        <g transform="translate(222,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#22242B"/></g>
        <g transform="translate(259,0)"><rect width="32" height="40" rx="8" fill="#12141A" stroke="#22242B"/></g>
      </g>
    </g>
    <!-- paste -->
    <text x="170" y="262" fill="#7CF0A8" font-size="12" font-weight="600" text-anchor="middle">⧉  Paste code — reads the shared link too</text>
    <!-- pinned Join + caption (safeAreaInset above keyboard) -->
    <rect x="24" y="286" width="292" height="42" rx="12" fill="#7CF0A8" opacity="0.4"/>
    <text x="170" y="312" fill="#07080C" font-size="14" font-weight="700" text-anchor="middle" opacity="0.8">Join</text>
    <text x="170" y="344" fill="#9EA0A6" font-size="10.5" text-anchor="middle">Enter the 8-character code from your host.</text>
    <!-- keyboard -->
    <rect x="4" y="360" width="332" height="236" rx="24" fill="#191B20"/>
    <rect x="4" y="360" width="332" height="30" fill="#14161B"/>
    <text x="312" y="380" fill="#7CF0A8" font-size="12" font-weight="700" text-anchor="end">Done</text>
    <g fill="#2A2D34">
      <rect x="18" y="402" width="304" height="30" rx="6"/><rect x="30" y="440" width="280" height="30" rx="6"/>
      <rect x="18" y="478" width="304" height="30" rx="6"/><rect x="60" y="516" width="220" height="30" rx="6"/>
    </g>
    <text x="170" y="572" fill="#5B5D63" font-size="9.5" text-anchor="middle">keyboard toolbar “Done” dismisses · Join pinned above via safeAreaInset</text>
  </g>

  <text x="40" y="1320" fill="#5B5D63" font-size="11.5">Approving this board is the crew gate 1. In-app renders re-check at the before/after gate; the lobby-fill fix (A0)</text>
  <text x="40" y="1338" fill="#5B5D63" font-size="11.5">is behavior, not pixels — it proves out on the two-phone pass. Hues shown are the shipped five; the ROH-114 widening</text>
  <text x="40" y="1356" fill="#5B5D63" font-size="11.5">adds three at plan stage under the same contrast tests.</text>
</svg>
