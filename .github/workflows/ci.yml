name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auracore-tests:
    name: AuraCore tests (swift test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # Pure-logic package: no simulator, no Mapbox token required.
      - name: Run AuraCore + AuraKit tests
        working-directory: AuraCore
        run: swift test
