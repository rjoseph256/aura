name: CI

# Jobs run on macos-15 with Xcode PINNED to 26.3 (Swift 6.2.4) — the version the project is
# developed and validated against. An older Swift-5-era image would reject the Swift 6 language
# mode the package and app use.
#
# Pinned rather than `latest-stable` deliberately (ROH-117). `latest-stable` re-resolves whenever
# GitHub updates the image, so the toolchain could change under us with no commit in between —
# a green run and a red run could differ by compiler alone. When you want a newer toolchain,
# raise this pin in a commit, so the change is reviewable and bisectable.
#
# The `toolchain-canary` job below covers the other half: it runs AHEAD of this pin, so a
# compiler change that breaks us shows up as a red canary rather than as a surprise red `main`
# the day the image rolls forward.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: AuraCore tests (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Show Swift version
        run: swift --version
      # Pure-logic package, now under Swift 6 language mode. No simulator, no Mapbox token.
      # --no-parallel: several suites create SwiftData ModelContainers; Swift Testing's
      # default parallel execution intermittently SIGABRTs inside CoreData
      # NSManagedObjectContext.performAndWait when SwiftData-backed suites run concurrently.
      # Serial execution is fast here (~0.5s for the whole suite) and deterministic.
      # The ROH-110 quarantine (`--skip RideSegmentBackfill`) is gone: that suite was never the
      # cause. The abort came from an `async` closure passed as a DEFAULT ARGUMENT, which is
      # duplicated into every referencing module and can end up linked with a frame-size record
      # from one copy and a body from another — see the note on `GroupRideSession.sleep`.
      # Measured 20/20 aborts before that fix and 0/20 after (x4 runners), with this suite
      # running both times.
      - name: Run AuraCore + AuraKit tests
        working-directory: AuraCore
        run: swift test --no-parallel

  app-build:
    # Keep the original display name — branch protection / required checks key on it.
    name: App build (xcodebuild)
    runs-on: macos-15
    # 50: cold SPM + Mapbox build + boot + FOUR golden-ride methods, each retried once
    # worst-case (ROH-93 added the navigate method; ROH-103 added the paused ride and the
    # navigate pause control). The paused method is the longest: it replays at 20x rather
    # than 30x to widen the pause window, so ~45 s plus its assertions. Note the retry flag
    # means a first-run flake still reports green — see the ROH-103 spec, D8.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Mapbox credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          umask 077
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > "$HOME/.netrc"
          printf '%s' "$MAPBOX_PUBLIC_TOKEN" > Aura/Resources/MapboxAccessToken
      - name: Generate project
        working-directory: Aura
        run: xcodegen generate
      - name: Select and boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list -j devices available | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key) | last | .value
            | map(select(.isAvailable and (.name | startswith("iPhone"))))
            | last | .udid')
          test -n "$UDID" && test "$UDID" != "null"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant location com.rohunjoseph.aura || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for testing (also builds the embedded AuraWidgets extension)
        working-directory: Aura
        run: |
          xcodebuild build-for-testing \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
      # Golden-ride E2E (ROH-92). Skipped for fork PRs: no Mapbox secrets there, so the
      # build above already failed anyway — the guard just makes intent explicit.
      - name: Golden ride E2E
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: Aura
        run: |
          xcodebuild test-without-building \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -only-testing:AuraUITests/RideE2EUITests \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO

  toolchain-canary:
    # Early warning for compiler changes ahead of the pinned toolchain (ROH-117).
    #
    # Why this exists: ROH-116 was a real region-isolation defect that only Swift 6.3 diagnoses.
    # Every other surface in this project — CI and the owner's Mac — runs 6.2.4, so the bug sat
    # green on `main` until a collaborator on a newer Xcode hit it. This job runs the toolchain
    # we would otherwise only meet by accident, on the day the runner image rolls forward.
    #
    # NOT in branch protection, on purpose. A compiler ahead of what the team develops against
    # should be visible when it breaks, not a merge blocker. Equally on purpose: no
    # `continue-on-error` — that renders the job green and nobody looks at it again.
    #
    # Build-only. No simulator boot, no golden-ride E2E: this is here to catch compile-level
    # toolchain breaks, and the behavioral surface is already covered by `App build` above.
    name: Toolchain canary (Xcode 26.6 / Swift 6.3)
    runs-on: macos-26
    # Fork PRs have no Mapbox secrets, so package resolution cannot succeed. Skip rather than
    # report a red canary that says nothing about the toolchain.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 40: cold SPM + Mapbox, no simulator boot and no E2E (so well under `app-build`'s 50).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Show Swift version
        run: swift --version
      # Package first: needs no secrets and no Mapbox download, so a language-level break in the
      # pure layer surfaces in ~2 minutes instead of after a cold SDK pull.
      - name: Run AuraCore + AuraKit tests
        working-directory: AuraCore
        run: swift test --no-parallel
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Mapbox credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          umask 077
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > "$HOME/.netrc"
          printf '%s' "$MAPBOX_PUBLIC_TOKEN" > Aura/Resources/MapboxAccessToken
      - name: Generate project
        working-directory: Aura
        run: xcodegen generate
      # `generic/platform=iOS Simulator` compiles without booting a device or hardcoding a model
      # name, which also keeps this job independent of which runtimes the image ships.
      - name: Build app target (also builds the embedded AuraWidgets extension)
        working-directory: Aura
        run: |
          xcodebuild build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint (--strict)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SwiftLint
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.64.1/portable_swiftlint.zip
          mkdir -p /tmp/swiftlint && unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"
      - name: Lint
        run: swiftlint lint --strict
      - name: Explore rename guard
        run: bash scripts/check-explore-rename.sh
      - name: Terrain style guard
        run: bash scripts/check-terrain-style.sh
      - name: Single active-time definition guard
        run: bash scripts/check-single-active-definition.sh
      - name: Monotonic instant guard
        run: bash scripts/check-monotonic-instants.sh
      # ROH-157. Nothing else can catch this one: when the wrapper stops running the
      # gate, every other guard on this list silently stops running locally too.
      - name: Task-gate handoff guard
        run: bash scripts/test-task-gate.sh

  db-tests:
    name: DB tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local stack
        run: supabase start
      - name: Run pgTAP
        run: supabase test db
