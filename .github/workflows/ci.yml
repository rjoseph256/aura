name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auracore-tests:
    name: AuraCore tests (swift test)
    # Use a modern macOS image + latest stable Xcode so the Swift toolchain matches
    # the dev environment (Swift 6's region-based isolation). The older Swift 5.10 on
    # macos-14 rejected concurrency captures that newer toolchains accept as warnings.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      # Pure-logic package: no simulator, no Mapbox token required.
      - name: Run AuraCore + AuraKit tests
        working-directory: AuraCore
        run: swift test
